<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelFight</title>

  <style>
    body {
      margin: 0;
      background: #070707;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #22c55e;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-size: 14px;
      color: #ccc;
    }

    main {
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 1fr 260px;
    }

    .canvas-area {
      position: relative;
      overflow: auto;
      background:
        radial-gradient(circle at center, #181818, #050505);
    }

    canvas {
      image-rendering: pixelated;
      cursor: crosshair;
      margin: 30px;
      border: 1px solid #333;
      background: #111;
    }

    aside {
      background: #101010;
      border-left: 1px solid #222;
      padding: 18px;
    }

    .card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #061006;
      font-weight: bold;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: #181818;
      border: 1px solid #333;
      padding: 22px;
      border-radius: 16px;
      width: 300px;
      text-align: center;
    }

    input[type="color"] {
      width: 100%;
      height: 50px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .cancel {
      background: #333;
      color: white;
    }

    .confirm {
      background: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Pixel<span>Fight</span></div>

  <div class="stats">
    <div>🟢 Online: <b id="online">1</b></div>
    <div>🎨 Pixels pintados: <b id="painted">0</b></div>
    <div>⏱ Cooldown: <b id="cooldown">Pronto</b></div>
  </div>
</header>

<main>
  <section class="canvas-area">
    <canvas id="canvas"></canvas>
  </section>

  <aside>
    <div class="card">
      <h3>Como funciona</h3>
      <p>Clique em um pixel, escolha uma cor e pinte o mural.</p>
      <p>Depois alguém pode atacar seu desenho.</p>
    </div>

    <div class="card">
      <h3>Ranking</h3>
      <p>1. Você — <span id="meusPixels">0</span> pixels</p>
      <p>2. Anônimo — 0 pixels</p>
      <p>3. Anônimo — 0 pixels</p>
    </div>

    <div class="card">
      <h3>Comprar tinta</h3>
      <button class="btn">Comprar pixels</button>
    </div>
  </aside>
</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Escolha sua cor</h2>
    <p id="pixelInfo"></p>

    <input type="color" id="colorPicker" value="#ff0000">

    <div class="modal-buttons">
      <button class="cancel" onclick="fecharModal()">Cancelar</button>
      <button class="confirm" onclick="confirmarCor()">Pintar</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const modal = document.getElementById("modal");
  const colorPicker = document.getElementById("colorPicker");
  const pixelInfo = document.getElementById("pixelInfo");

  const paintedEl = document.getElementById("painted");
  const meusPixelsEl = document.getElementById("meusPixels");
  const cooldownEl = document.getElementById("cooldown");

  const cols = 1000;
  const rows = 1000;
  const size = 6;

  let quadradoSelecionado = null;
  let pixelsPintados = 0;
  let meusPixels = 0;
  let podePintar = true;

  canvas.width = cols * size;
  canvas.height = rows * size;

  const pixels = new Map();

  function desenharPixel(x, y, cor = "#1f2937") {
    ctx.fillStyle = cor;
    ctx.fillRect(x * size, y * size, size - 1, size - 1);
  }

  function desenharTudo() {
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        desenharPixel(x, y);
      }
    }
  }

  desenharTudo();

  canvas.addEventListener("click", (event) => {
    if (!podePintar) {
      alert("Aguarde o cooldown acabar.");
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((event.clientX - rect.left) / size);
    const y = Math.floor((event.clientY - rect.top) / size);

    quadradoSelecionado = { x, y };
    pixelInfo.innerText = `Pixel selecionado: X ${x}, Y ${y}`;

    modal.style.display = "flex";
  });

  function confirmarCor() {
    if (!quadradoSelecionado) return;

    const { x, y } = quadradoSelecionado;
    const cor = colorPicker.value;
    const key = `${x},${y}`;

    if (!pixels.has(key)) {
      pixelsPintados++;
      meusPixels++;
    }

    pixels.set(key, cor);
    desenharPixel(x, y, cor);

    paintedEl.innerText = pixelsPintados;
    meusPixelsEl.innerText = meusPixels;

    fecharModal();
    iniciarCooldown(10);
  }

  function fecharModal() {
    modal.style.display = "none";
    quadradoSelecionado = null;
  }

  function iniciarCooldown(segundos) {
    podePintar = false;
    let restante = segundos;

    cooldownEl.innerText = `${restante}s`;

    const timer = setInterval(() => {
      restante--;
      cooldownEl.innerText = `${restante}s`;

      if (restante <= 0) {
        clearInterval(timer);
        podePintar = true;
        cooldownEl.innerText = "Pronto";
      }
    }, 1000);
  }
</script>

</body>
</html>
